[package]
name = "freecut"
version = "0.1.12"
authors = ["Gerhard Schwanzer <geri@sdf.org>"]
edition = "2021"
license = "Apache-2.0"
description = "A cut optimizer gui for cutting rectangular pieces from panels"
repository = "https://github.com/geri1701/freecut"
keywords = ["gui", "cuts", "optimize", "optimization", "bin-packer"]

[dependencies]
cut-optimizer-2d = "*"
pdf-canvas = "*"
rand = "*"
comfy-table = "*"
fltk = "*"
cascade = "*"
#rmp-serde = "1.3"
serde = { version="*", features = ["derive"] }
serde_json = "*"
uom = "*"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
